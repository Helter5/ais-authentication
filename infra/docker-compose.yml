services:
  postgres:
    image: postgres:16-alpine
    container_name: ais-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ais_auth}
      POSTGRES_USER: ${DB_USER:-ais_auth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ais_auth}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ais_auth} -d ${DB_NAME:-ais_auth}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: ais-auth-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI (http://localhost:8025)

volumes:
  postgres_data:
