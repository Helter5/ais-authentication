server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Spring Security's default headers (X-Content-Type-Options, X-Frame-Options, ...) only cover
    # backend responses under /api/ - the SPA's own HTML/JS/CSS served straight from disk here
    # never gets them without setting them explicitly at this layer too.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # img-src allows cdn.discordapp.com for Discord avatars (see Layout.tsx); connect-src 'self'
    # covers same-origin /api/ calls and SSE streams (nginx proxies both on this origin, no CORS).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Spring Boot backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Without this, every request reaches the backend from nginx's own container IP, making
        # AuthEndpointRateLimiter and OAuth2LoginSuccessHandler's access-log IP useless (all users
        # look identical). $proxy_add_x_forwarded_for appends to any inbound X-Forwarded-For rather
        # than trusting it outright, so a spoofed client-supplied header can't hide the real hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Our SSE streams (maintenance mode, verification status) are intentionally long-lived
        # and only send a byte when state actually changes - nginx's 60s default proxy_read_timeout
        # otherwise treats that as an idle upstream and kills the connection every ~60s, forcing a
        # reconnect loop instead of one truly persistent connection per tab.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # While the backend container is (re)starting, upstream connect/read failures would
        # otherwise surface as nginx's bare "502 Bad Gateway" page - including on full-page
        # navigations like the Discord OAuth callback, not just background API calls. Show a
        # friendly auto-refreshing page instead until the backend is reachable again.
        proxy_intercept_errors on;
        error_page 502 503 504 /restarting.html;
    }

    location = /restarting.html {
        root /usr/share/nginx/html;
        internal;
    }
}
