server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Spring Boot backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # While the backend container is (re)starting, upstream connect/read failures would
        # otherwise surface as nginx's bare "502 Bad Gateway" page - including on full-page
        # navigations like the Discord OAuth callback, not just background API calls. Show a
        # friendly auto-refreshing page instead until the backend is reachable again.
        proxy_intercept_errors on;
        error_page 502 503 504 /restarting.html;
    }

    location = /restarting.html {
        root /usr/share/nginx/html;
        internal;
    }
}
