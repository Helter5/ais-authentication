<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Restarting…</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="3">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #09090b;
    color: #a1a1aa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card { text-align: center; padding: 0 24px; }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 16px;
    border: 3px solid rgba(129, 140, 248, 0.25);
    border-top-color: #818cf8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 16px; color: #e4e4e7; margin: 0 0 6px; font-weight: 600; }
  p { font-size: 13px; margin: 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Bot is restarting…</h1>
    <p>This page will refresh automatically in a few seconds.</p>
  </div>
</body>
</html>
