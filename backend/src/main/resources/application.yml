spring:
  application:
    name: ais-auth-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ais_auth}
    username: ${DB_USER:ais_auth}
    password: ${DB_PASSWORD:ais_auth}
    hikari:
      maximum-pool-size: 20 # default 10 was too thin - a burst of page navigation firing several DB-backed calls at once queued up past it
      connection-timeout: 10000 # default 30000 - fail fast instead of a request silently hanging ~30s waiting for a free connection

  jpa:
    open-in-view: false # inak SSE endpointy (napr. maintenance/stream) drzia Hikari connection po celu dobu spojenia
    hibernate:
      ddl-auto: validate # schéma sa spravuje výhradne cez Flyway migrácie, nie auto-generovaním
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ldap:
    urls: ${LDAP_URL:ldap://localhost:389}
    base: ${LDAP_BASE:ou=People,dc=stuba,dc=sk}
    username: ${LDAP_USERNAME:}
    password: ${LDAP_PASSWORD:}
    base-environment:
      com.sun.jndi.ldap.connect.timeout: 5000 # bez timeoutu vie vypadok VPN tunela k univerzitnemu LDAP zablokovat request navzdy
      # 90s - namerane vypadky spojenia na univerzitnu siet trvaju az ~65s (opakovany cyklus, nie
      # ojedinely blip), pricom spojenie sa samo obnovi bez zahodenia - kratky read timeout ho zabije
      # skor nez sa stihne opravit. 90s prekryje pozorovany najhorsi pripad s rezervou.
      com.sun.jndi.ldap.read.timeout: 90000

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false} # Mailpit potrebuje false (bez auth); realny SMTP nastav MAIL_SMTP_AUTH=true
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false} # port 587 -> true; port 465 (implicitne SSL) -> MAIL_SMTP_SSL=true namiesto tohto
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
          connectiontimeout: 10000 # bez timeoutu vie zle nakonfigurovany SMTP (napr. spatna kombinacia port/ssl) blokovat
          timeout: 10000           # celu /verify interakciu na minuty - radsej rychlo zlyhat s chybovou hlaskou
          writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness a /readiness - nezavisia od LDAP (na rozdiel od agregovaneho /actuator/health), pouzivane v Docker HEALTHCHECK

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-signing-key-at-least-32-bytes-long!!}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:300}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}
  verification:
    allowed-faculties:
      - fei-stud
    required-account-status: student:active
    testing-mode: ${VERIFICATION_TESTING_MODE:false} # true: /verify preskoci odoslanie mailu a ukaze kod priamo v Discorde
  mail:
    from: ${MAIL_FROM:Verifikácia <noreply@stuba.sk>}
  admin:
    super-admin-ids: ${SUPER_ADMIN_IDS:}
  discord:
    client-id: ${DISCORD_CLIENT_ID:}
    client-secret: ${DISCORD_CLIENT_SECRET:}
    redirect-uri: ${DISCORD_REDIRECT_URI:http://localhost:8080/api/auth/discord/callback}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  discord-bot:
    token: ${DISCORD_BOT_TOKEN:}
    guild-id: ${DISCORD_GUILD_ID:} # ak je nastavene, slash commandy sa registruju len na tento server (okamzite, na rozdiel od globalnych)

logging:
  level:
    sk.gkanocz.aisauth: DEBUG
